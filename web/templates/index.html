<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME12 - Actualización Masiva de Precio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f5f6f7;
            color: #333;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background-color: #fff;
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        input[type="file"] {
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #btn-run {
            background-color: #0073e6;
            color: #fff;
        }
        #btn-run:disabled {
            background-color: #a0c4e8;
            cursor: not-allowed;
        }
        a.link-template {
            font-size: 14px;
            color: #0073e6;
            text-decoration: none;
        }
        a.link-template:hover {
            text-decoration: underline;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .badge.processing {
            background-color: #fff3e0;
            color: #ef6c00;
        }
        .badge.error {
            background-color: #ffebee;
            color: #c62828;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }
        .log-panel {
            margin-top: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        .log-header {
            background-color: #f0f2f5;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
        }
        #log-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 360px;
            overflow-y: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
        }
        #log-list li {
            padding: 8px 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        #log-list li:last-child {
            border-bottom: none;
        }
        .empty-log {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ME12 - Actualización Masiva de Precio</h1>

        <div class="row">
            <span id="status-badge" class="badge"><span class="dot"></span> Listo</span>
        </div>

        <div class="row">
            <input type="file" id="file-input" accept=".xlsx">
            <button id="btn-run" disabled>Ejecutar</button>
            <a class="link-template" href="/download-template" download>Descargar Plantilla Excel</a>
            <button id="btn-clear" type="button">Limpiar log</button>
        </div>

        <div class="log-panel">
            <div class="log-header">Log de ejecución</div>
            <ul id="log-list">
                <li class="empty-log">Aún no hay mensajes.</li>
            </ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        (function () {
            const fileInput = document.getElementById('file-input');
            const btnRun = document.getElementById('btn-run');
            const btnClear = document.getElementById('btn-clear');
            const statusBadge = document.getElementById('status-badge');
            const logList = document.getElementById('log-list');

            // Defensa en profundidad: una vez que finaliza una ejecución con
            // error, el badge de estado debe mantenerse en rojo y no cambiar a
            // "Listo" por eventos status posteriores.
            let executionFinished = false;
            let lastOk = false;

            function clearLog() {
                logList.innerHTML = '';
                const empty = document.createElement('li');
                empty.className = 'empty-log';
                empty.textContent = 'Aún no hay mensajes.';
                logList.appendChild(empty);
            }

            function setStatus(text, type) {
                statusBadge.className = 'badge' + (type ? ' ' + type : '');
                statusBadge.innerHTML = '<span class="dot"></span> ' + text;
            }

            function appendLog(message) {
                const empty = logList.querySelector('.empty-log');
                if (empty) {
                    empty.remove();
                }
                const item = document.createElement('li');
                item.textContent = message;
                logList.appendChild(item);
                logList.scrollTop = logList.scrollHeight;
            }

            fileInput.addEventListener('change', function () {
                if (!fileInput.files.length) {
                    return;
                }

                const file = fileInput.files[0];
                if (!file.name.toLowerCase().endsWith('.xlsx')) {
                    appendLog('Error: el archivo debe tener extensión .xlsx');
                    btnRun.disabled = true;
                    fileInput.value = '';
                    return;
                }

                appendLog('Validando...');
                btnRun.disabled = true;

                const formData = new FormData();
                formData.append('file', file);

                fetch('/upload', { method: 'POST', body: formData })
                    .then(function (response) { return response.json(); })
                    .then(function (data) {
                        if (data && data.ok) {
                            appendLog('Archivo válido: ' + (data.rows || 0) + ' filas');
                            btnRun.disabled = false;
                        } else {
                            const errors = (data && data.errors) ? data.errors : ['Error desconocido al validar el archivo.'];
                            errors.forEach(function (err) {
                                appendLog('Error: ' + err);
                            });
                            btnRun.disabled = true;
                            fileInput.value = '';
                        }
                    })
                    .catch(function (err) {
                        appendLog('Error de comunicación: ' + err);
                        btnRun.disabled = true;
                        fileInput.value = '';
                    });
            });

            const socket = io();

            socket.on('connect', function () {
                appendLog('Conectado al servidor.');
            });

            socket.on('disconnect', function () {
                appendLog('Desconectado del servidor.');
            });

            socket.on('log', function (data) {
                appendLog(typeof data === 'string' ? data : (data.message || JSON.stringify(data)));
            });

            socket.on('status', function (data) {
                const status = typeof data === 'string' ? data : (data.status || 'ready');
                // Opción B (defensa en profundidad): si la última ejecución
                // terminó con error, no permitir que un status posterior la
                // pinte como exitosa.
                if (executionFinished && !lastOk && status === 'ready') {
                    return;
                }
                if (status === 'processing') {
                    setStatus('Procesando...', 'processing');
                    fileInput.disabled = true;
                    btnRun.disabled = true;
                } else if (status === 'error') {
                    setStatus('Error', 'error');
                    fileInput.disabled = false;
                    btnRun.disabled = true;
                } else {
                    setStatus('Listo', '');
                    fileInput.disabled = false;
                    btnRun.disabled = true;
                }
            });

            socket.on('complete', function (data) {
                const ok = data && data.ok;
                // Marcar la ejecución como finalizada para blindar el badge.
                executionFinished = true;
                lastOk = ok;
                const summary = (data && data.summary) ? data.summary : 'Sin resumen';
                appendLog('Completo: ' + summary);
                setStatus(ok ? 'Listo' : 'Error', ok ? '' : 'error');
                btnRun.disabled = true;
                fileInput.disabled = false;
                fileInput.value = '';
            });

            btnClear.addEventListener('click', function () {
                clearLog();
            });

            btnRun.addEventListener('click', function () {
                if (btnRun.disabled) {
                    return;
                }
                btnRun.disabled = true;
                appendLog('Iniciando ejecución ME12...');

                fetch('/execute', { method: 'POST' })
                    .then(function (response) { return response.json(); })
                    .then(function (data) {
                        if (!data || !data.ok) {
                            appendLog('Error al iniciar: ' + (data && data.message ? data.message : 'respuesta inesperada'));
                            setStatus('Error', 'error');
                            btnRun.disabled = false;
                        }
                    })
                    .catch(function (err) {
                        appendLog('Error de comunicación al iniciar: ' + err);
                        setStatus('Error', 'error');
                        btnRun.disabled = false;
                    });
            });
        })();
    </script>
</body>
</html>
